<style>
/* ============================================================
   1. RESET + FUNDAMENT
   Wspólne "rusztowanie" — każdy styl nadpisuje zmienne CSS
   (kolory, fonty, promienie, odstępy), a dodatkowo ma własne
   reguły strukturalne, dzięki czemu warianty wyglądają jak
   zupełnie osobne projekty.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

:root{
  --maxw:1180px;
  --sp:96px;              /* pionowy "oddech" sekcji (whitespace) */
  --bg:#0d0b09;--bg2:#15120e;--fg:#f3ead9;--muted:#b7a98c;
  --accent:#d4af37;--accent2:#b08d57;--on-accent:#1a1408;
  --card:#171310;--border:#d4af3733;--radius:8px;--btn-r:8px;
  --font-h:'Playfair Display',serif;--font-b:'Inter',sans-serif;
}
body{font-family:var(--font-b);background:var(--bg);color:var(--fg);line-height:1.65;
  transition:background .5s ease,color .5s ease}
.container{max-width:var(--maxw);margin-inline:auto;padding-inline:24px}
.section{padding-block:var(--sp)}
.section--alt{background:var(--bg2)}
h1,h2,h3,h4{font-family:var(--font-h);line-height:1.15;font-weight:600}
h2{font-size:clamp(1.8rem,3.6vw,2.7rem);margin-bottom:12px}
p{max-width:65ch}
.center{text-align:center}
.center p{margin-inline:auto}

/* mały nagłówek-etykieta nad tytułami sekcji */
.kicker{display:inline-block;font:600 12px/1 var(--font-b);letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.sec-head{margin-bottom:48px}
.sec-head .sub{color:var(--muted);font-size:1.05rem}

/* ---------- Przyciski CTA — duże, kontrastowe, czytelne (dostępność) ---------- */
.btn{display:inline-block;padding:15px 30px;border-radius:var(--btn-r);
  font:600 15px var(--font-b);letter-spacing:.03em;text-decoration:none;cursor:pointer;
  border:2px solid transparent;transition:transform .25s,box-shadow .25s,background .25s,color .25s}
.btn--primary{background:var(--accent);color:var(--on-accent)}
.btn--primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px var(--accent)}
.btn--ghost{border-color:var(--accent);color:var(--accent);background:transparent}
.btn--ghost:hover{background:var(--accent);color:var(--on-accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}

/* ---------- Siatki i karty ---------- */
.grid-2{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid-3{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-4{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:30px;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-5px);box-shadow:0 22px 40px -18px rgba(0,0,0,.55)}

/* ============================================================
   2. STICKY HEADER AGENCJI — przełącznik 6 stylów
   Celowo neutralny (ciemny), żeby nie "kłócił się" z żadnym
   z prezentowanych wariantów — to warstwa narzędzia demo.
   ============================================================ */
.top{position:sticky;top:0;z-index:1000;background:#0c0c10f2;backdrop-filter:blur(10px);
  border-bottom:1px solid #ffffff1f;color:#fff}
.top__inner{display:flex;align-items:center;gap:18px;padding:10px 18px;max-width:1500px;margin-inline:auto}
.top__brand{font:700 12px/1.3 'Inter';letter-spacing:.16em;text-transform:uppercase;color:#9a9aa5;white-space:nowrap}
.top__brand b{color:#fff}
.top__tabs{display:flex;gap:8px;overflow-x:auto;padding-block:4px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid #ffffff30;background:transparent;color:#d6d6de;
  padding:8px 16px;border-radius:999px;font:500 13px 'Inter';cursor:pointer;transition:.25s;white-space:nowrap}
.tab:hover{border-color:#fff;color:#fff}
.tab.active{background:#fff;color:#101014;border-color:#fff;font-weight:700}
.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ============================================================
   3. LOADER — krótki sygnał "ładowanie nowego stylu"
   (płynna zmiana wariantu = wrażenie osobnego projektu)
   ============================================================ */
.loader{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;gap:16px;
  align-items:center;justify-content:center;background:#0c0c10;color:#fff;
  opacity:0;pointer-events:none;transition:opacity .35s}
.loader.on{opacity:1;pointer-events:all}
.spinner{width:44px;height:44px;border:3px solid #ffffff26;border-top-color:#fff;
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font:500 14px 'Inter';letter-spacing:.08em;color:#c8c8d2}
#app{transition:opacity .45s ease,transform .45s ease}
#app.hide{opacity:0;transform:translateY(16px)}

/* ============================================================
   4. ANIMACJE PRZY SCROLLU (fade-in) — subtelny "zachwyt"
   bez rozpraszania; IntersectionObserver dodaje klasę .in
   ============================================================ */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  *{animation-duration:.01ms!important}
}
</style>

/* ---------- Instagram feed (wizualny social proof) ---------- */
.ig-grid{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}
.ig-grid a{position:relative;display:block;overflow:hidden;border-radius:var(--radius)}
.ig-grid img{aspect-ratio:1/1;object-fit:cover;width:100%;transition:transform .4s}
.ig-grid a:hover img{transform:scale(1.08)}
.ig-grid a::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;
  color:#fff;background:#00000066;opacity:0;transition:.3s}
.ig-grid a:hover::after{opacity:1}
@media(max-width:860px){.ig-grid{grid-template-columns:repeat(3,1fr)}}

/* ---------- FAQ ---------- */
.faq{max-width:800px;margin-inline:auto}
.faq details{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);
  margin-bottom:12px;overflow:hidden}
.faq summary{cursor:pointer;padding:20px 24px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-size:1.4rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq .a{padding:0 24px 22px;color:var(--muted)}

/* ---------- Rezerwacja (formularz) ---------- */
.booking .container{display:grid;gap:56px;grid-template-columns:1fr 1.1fr;align-items:start}
.form{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.form input,.form select,.form textarea{width:100%;padding:14px 16px;background:var(--bg);
  border:1px solid var(--border);border-radius:var(--btn-r);color:var(--fg)}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.form .ok{grid-column:1/-1;display:none;padding:16px;border:1px solid var(--accent);color:var(--accent);border-radius:var(--btn-r);text-align:center}
.gift{display:flex;gap:14px;align-items:flex-start;margin-top:26px;padding:18px;border:1px dashed var(--accent);border-radius:var(--radius);font-size:.95rem}
.gift .ico{font-size:1.5rem}
@media(max-width:860px){.booking .container{grid-template-columns:1fr}}

/* ---------- Mapa + godziny ---------- */
.map .container{display:grid;gap:36px;grid-template-columns:1.2fr .8fr;align-items:stretch}
.map iframe{width:100%;height:100%;min-height:340px;border:0;border-radius:var(--radius);filter:grayscale(.4)}
.hours .row{display:flex;justify-content:space-between;padding-block:11px;border-bottom:1px solid var(--border);font-size:.95rem}
.hours .row b{color:var(--accent)}
@media(max-width:860px){.map .container{grid-template-columns:1fr}}

/* ---------- Stopka (PEAK-END: mocne domknięcie + CTA) ---------- */
.footer{background:var(--bg2);border-top:1px solid var(--border)}
.footer__cta{text-align:center;padding-block:86px 66px}
.footer__cta h2{font-size:clamp(2rem,4.4vw,3.4rem)}
.footer__cta p{margin:14px auto 0;color:var(--muted)}
.footer__cols{display:grid;gap:36px;grid-template-columns:2fr 1fr 1fr 1.4fr;padding-block:52px;border-top:1px solid var(--border)}
.footer__cols h4{font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.footer__cols ul{list-style:none;display:grid;gap:9px;color:var(--muted);font-size:.94rem}
.footer__cols a{text-decoration:none}
.footer__cols a:hover{color:var(--accent)}
.newsletter{display:flex;gap:0;margin-top:14px}
.newsletter input{flex:1;padding:13px 16px;background:var(--bg);border:1px solid var(--border);
  border-right:0;border-radius:var(--btn-r) 0 0 var(--btn-r);color:var(--fg);min-width:0}
.newsletter button{padding:13px 18px;background:var(--accent);color:var(--on-accent);border:0;
  border-radius:0 var(--btn-r) var(--btn-r) 0;font-weight:700;cursor:pointer}
.footer__bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding-block:22px;
  border-top:1px solid var(--border);color:var(--muted);font-size:.84rem}
@media(max-width:900px){.footer__cols{grid-template-columns:1fr 1fr}}

/* ---------- Marquee (S3) ---------- */
.marquee{overflow:hidden;border-block:1px solid var(--border);padding-block:18px;background:var(--bg2)}
.marquee__inner{display:flex;gap:48px;width:max-content;animation:mq 22s linear infinite;
  font:700 1.2rem var(--font-h);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.marquee__inner span em{font-style:normal;color:var(--accent);margin-right:48px}
@keyframes mq{to{transform:translateX(-50%)}}
</style>

      footT:'Umów wizytę już dziś', footX:'Zadzwoń: +48 575 555 689 · Jacentów 119, Sadowie'}},
  s6:{name:'Styl 6 · Glamour Premium', hero:'cinema',
    order:['hero','trust:press','about','ba','pricing:list','team','reviews:big','stats','booking','promo','footer'],
    copy:{brand:'Studio Fryzur Izabela Cybula', kicker:'Haute Coiffure',
      h1:'Perfekcja jest<br>kwestią detalu',
      sub:'Salon fryzjerski w Sadowiu stworzony dla kobiet i mężczyzn, którzy chcą dobrze wyglądać i czuć się komfortowo. Każda wizyta jest dopasowana do potrzeb klienta i jego stylu.',
      cta1:'Zarezerwuj konsultację', cta2:'Poznaj salon', heroImg:'salon1',
      aboutT:'Dbałość o detal i profesjonalny efekt',
      aboutX:'Studio Fryzur Izabela Cybula to miejsce, w którym liczy się indywidualne podejście, estetyka i profesjonalna realizacja. Dbamy o to, aby każda stylizacja była nie tylko piękna, ale też trwała i odpowiadała Twojemu codziennemu stylowi.',
      promoT:'Bezpłatna konsultacja przed zabiegiem', promoX:'Przygotujemy cię do wyboru najlepszego rozwiązania i zaproponujemy efektywne oraz naturalne podejście do fryzjerstwa.',
      footT:'Doświadcz profesjonalnego salonu', footX:'Jacentów 119, Sadowie · +48 575 555 689'}},
  s7:{name:'Styl 7 · Klasyk', hero:'split',
    order:['hero','about','stats','ba','pricing:cards','team','reviews:grid','promo','booking','map','faq','footer'],
    copy:{brand:'Studio Fryzur Izabela Cybula', kicker:'𝓢𝓽𝓾𝓭𝓲𝓸 𝓕𝓻𝔂𝔃𝓾𝓻 𝓘𝔃𝓪𝓫𝓮𝓵𝓪 𝓒𝔂𝓫𝓾𝓵𝓪',
      h1:'Piękno, które wygląda <em>naturalnie</em>',
      sub:'W salonie dbamy o włosy, stylizację i komfort — tak, żeby efekt był nie tylko modny, ale przede wszystkim zgodny z Twoją naturą i codziennym życiem.',
      cta1:'Umów wizytę', cta2:'Zobacz efekty', heroImg:'styling2',
      aboutT:'Salon, który dba o każdy detal',
      aboutX:'Na fanpage pojawia się profesjonalny, ciepły i nowoczesny wizerunek salonu. To estetyka, która łączy mocne zdjęcia, elegancki klimat oraz prostotę komunikacji. W praktyce oznacza to przyjazne miejsce, gdzie liczy się nie tylko wygląd, ale też jakość obsługi i relacja z klientką.',
      promoT:'Indywidualna konsultacja przed wizytą', promoX:'Zanim podejmiesz decyzję, poznajemy Twoje potrzeby i dobieramy najlepszy zabieg, który będzie odpowiadał włosom i stylowi życia.',
      footT:'Umów wizytę u nas', footX:'Jacentów 119, Sadowie · +48 575 555 689'}},
};

<script>
/* ============================================================
   RENDERERY SEKCJI
   Każdy zwraca string HTML. data-block = identyfikator modułu
   (dla klienta: "chcę blok X w wersji ze stylu Y").
   ============================================================ */
const stars = n=>'★'.repeat(n)+'☆'.repeat(5-n);
const R = {};

/* ---- HERO — PEAK-END RULE: mocne, zachwycające pierwsze wrażenie.
   CTA podwójne = zasada małych kroków: łagodne "Zobacz..." dla
   niezdecydowanych + główne "Umów wizytę" dla gotowych. ---- */
R.hero = (s)=>{
  const c=s.copy, im=IMG[c.heroImg];
  const ctas = `<div class="btn-row">
      <a class="btn btn--primary" href="#rezerwacja">${c.cta1}</a>
      <a class="btn btn--ghost" href="#metamorfozy">${c.cta2}</a></div>`;
  const head = `<span class="kicker">${c.kicker}</span><h1>${c.h1}</h1><p class="sub" style="color:var(--muted);font-size:1.12rem;margin-top:14px">${c.sub}</p>`;
  if(s.hero==='split') return `<section class="hero hero--split" data-block="hero">
    <div class="container"><div class="hero__content reveal">${head}${ctas}</div>
    <div class="hero__img reveal"><img src="${im}" alt="Stylizacja włosów w salonie ${c.brand}"></div></div></section>`;
  if(s.hero==='full') return `<section class="hero hero--full" data-block="hero">
    <img class="hero__bg" src="${im}" alt="" data-parallax>
    <div class="hero__content reveal">${head}${ctas.replace('btn-row','btn-row" style="justify-content:center')}</div></section>`;
  if(s.hero==='typo') return `<section class="hero hero--typo section" data-block="hero">
    <div class="container"><div class="reveal"><span class="kicker">${c.kicker}</span><h1>${c.h1}</h1>
    <p style="color:var(--muted);font-size:1.12rem;margin-top:22px;max-width:52ch">${c.sub}</p>${ctas}</div>
    <div class="hero__strip reveal"><img src="${IMG.styling1}" alt="Odważna koloryzacja"><img src="${IMG.styling2}" alt="Nowoczesne cięcie"><img src="${IMG.styling3}" alt="Stylizacja w salonie"></div></div></section>`;
  if(s.hero==='soft') return `<section class="hero hero--soft" data-block="hero">
    <div class="container"><div class="hero__img reveal"><img src="${im}" alt="Wnętrze pracowni ${c.brand}"></div>
    <div class="hero__content reveal">${head}${ctas}</div></div></section>`;
  if(s.hero==='dark') return `<section class="hero hero--dark" data-block="hero">
    <img class="hero__bg" src="${im}" alt="" data-parallax>
    <div class="hero__content container reveal">${head}${ctas}</div></section>`;
  /* cinema (S6) */
  return `<section class="hero hero--cinema" data-block="hero">
    <img class="hero__bg" src="${im}" alt="" data-parallax>
    <div class="hero__content reveal"><span class="kicker">${c.kicker}</span><h1>${c.h1}</h1>
    <p style="color:var(--muted);font-size:1.1rem">${c.sub}</p>
    <div class="btn-row"><a class="btn btn--primary" href="#rezerwacja">${c.cta1}</a></div>
    <div class="rule"></div></div></section>`;
};

/* ---- PASEK ZAUFANIA — SOCIAL PROOF w pierwszym ekranie:
   liczby + oceny + "polecane przez" obniżają nieufność od razu.
   Wariant "press" (S6) = AUTORYTET mediów zamiast liczb. ---- */
R.trust = (s,variant)=>{
  if(variant==='press') return `<section class="trust trust--press reveal" data-block="pasek-zaufania">
    <div class="container"><div class="trust__item">Vogue&nbsp;Polska</div><div class="trust__item">ELLE</div>
    <div class="trust__item">Harper's&nbsp;Bazaar</div><div class="trust__item">K&nbsp;MAG</div>
    <div class="trust__item"><span class="star">★</span>&nbsp;Best&nbsp;of&nbsp;Beauty&nbsp;2025</div></div></section>`;
  return `<section class="trust reveal" data-block="pasek-zaufania"><div class="container">
    <div class="trust__item"><b>5000+</b> klientów</div>
    <div class="trust__item"><span class="star">★★★★★</span> <b>4.9</b> (640 opinii Google)</div>
    <div class="trust__item"><b>12 lat</b> na rynku</div>
    <div class="trust__item">Certyfikaty <b>L'Oréal · Wella</b></div>
    <div class="trust__item">Polecane przez <b>Booksy</b></div></div></section>`;
};

/* ---- O NAS — STORYTELLING + AUTORYTET (historia, wartości) ---- */
R.about = (s)=>{
  const c=s.copy;
  return `<section class="about section" data-block="o-nas" id="o-nas"><div class="container">
    <div class="reveal"><span class="kicker">O nas</span><h2>${c.aboutT}</h2>
    <p style="color:var(--muted)">${c.aboutX}</p>
    <div class="sig">— zespół ${c.brand}</div>
    <div class="btn-row"><a class="btn btn--ghost" href="#zespol">Poznaj zespół</a></div></div>
    <div class="reveal"><img src="${IMG.salon1}" alt="Wnętrze salonu ${c.brand}"></div></div></section>`;
};

/* ---- PRZED / PO — EFEKT KONTRASTU: metamorfoza jako namacalny
   dowód skuteczności. Suwak angażuje (interakcja > bierne oglądanie). ---- */
R.ba = ()=>{
  const pair=(b,a,cap)=>`<div><div class="ba reveal" style="--pos:50%">
    <img src="${b}" alt="Włosy przed metamorfozą">
    <img class="after" src="${a}" alt="Włosy po metamorfozie">
    <span class="ba__tag ba__tag--b">Przed</span><span class="ba__tag ba__tag--a">Po</span>
    <div class="ba__handle"></div>
    <input class="ba__range" type="range" min="0" max="100" value="50" aria-label="Porównanie przed i po"></div>
    <p class="ba-cap">${cap}</p></div>`;
  return `<section class="section section--alt" data-block="przed-po" id="metamorfozy"><div class="container">
    <div class="sec-head center reveal"><span class="kicker">Metamorfozy</span><h2>Zobacz różnicę na własne oczy</h2>
    <p class="sub">Przesuń suwak — każde zdjęcie to prawdziwa klientka naszego salonu.</p></div>
    <div class="ba-grid">
      ${pair(IMG.w4, IMG.w6, 'Balayage + strzyżenie warstwowe · 1 wizyta, 3,5 godziny')}
      ${pair(IMG.w5, IMG.w7, 'Metamorfoza koloru + rytuał keratynowy · plan 2 wizyt')}
    </div></div></section>`;
};

/* ---- CENNIK — 3 warianty prezentacji. Transparentne ceny budują
   zaufanie; wyróżniona pozycja (badge "bestseller") = social proof. ---- */
const servicePanel = x=>`<aside class="service-panel" aria-label="Szczegóły usługi ${x.n}">
  <span class="service-panel__label">Szczegóły usługi</span>
  <h3>${x.n}</h3>
  <div class="service-panel__meta"><span>${x.p}</span><span>${x.time}</span></div>
  <p class="service-panel__description">${x.d}. Podczas wizyty przeprowadzimy konsultację, dobierzemy rozwiązanie do Twoich włosów i zadbamy o komfortowy przebieg zabiegu. ${x.perks.join('. ')}. Poczujesz różnicę w wyglądzie, dotyku i łatwości codziennej stylizacji.</p>
  <p class="service-panel__who"><b>Dla kogo:</b> ${x.forWho}.</p>
  <a class="service-panel__cta" href="#rezerwacja">Umów wizytę</a>
</aside>`;
const s7Character = x=>`<div class="s7-character" aria-hidden="true">
  <img src="osoba.png" alt="">
  <div class="s7-speech">${x.s7Speech}</div>
</div>`;

R.pricing = (s,variant)=>{
  const head=`<div class="sec-head center reveal"><span class="kicker">Cennik</span><h2>Przejrzyste ceny, bez niespodzianek</h2>
    <p class="sub">Ostateczna wycena zawsze po bezpłatnej konsultacji — zależy od długości i gęstości włosów.</p></div>`;
  if(variant==='list') return `<section class="section" data-block="cennik" id="cennik"><div class="container">${head}
    <div class="price-list reveal">${SERVICES.map(x=>`<div class="price-list__item service-panel-host" tabindex="0"><div class="row"><b>${x.n}</b><span class="dots"></span><span class="val">${x.p}</span></div>${servicePanel(x)}</div>`).join('')}</div>
    <div class="center" style="margin-top:40px"><a class="btn btn--primary" href="#rezerwacja">Zarezerwuj termin</a></div></div></section>`;
  if(variant==='table') return `<section class="section" data-block="cennik" id="cennik"><div class="container">${head}
    <div class="reveal price-table-wrap"><table class="price-table">
    <thead><tr><th>Usługa</th><th>Zakres</th><th>Cena</th></tr></thead>
    <tbody>${SERVICES.map(x=>`<tr><td><div class="service-table-trigger service-panel-host" tabindex="0"><b>${x.n}</b>${servicePanel(x)}</div></td><td style="color:var(--muted)">${x.d}</td><td>${x.p}</td></tr>`).join('')}</tbody></table></div>
    <div class="center" style="margin-top:40px"><a class="btn btn--primary" href="#rezerwacja">Rezerwuj fotel</a></div></div></section>`;
  return `<section class="section" data-block="cennik" id="cennik"><div class="container">${head}
    <div class="grid-3">${SERVICES.map(x=>`<div class="card price-card reveal service-panel-host" tabindex="0">
      ${s===STYLES.s7?s7Character(x):''}
        <div class="price-card__front">
          ${x.hot?'<span class="badge">Najczęściej wybierane</span>':''}
          <div>
            <div class="from">cena</div>
            <h3>${x.n}</h3>
            <div class="price">${x.p}</div>
          </div>
          <p class="desc">${x.d}</p>
        </div>${servicePanel(x)}
    </div>`).join('')}</div>
    <div class="center" style="margin-top:44px"><a class="btn btn--primary" href="#rezerwacja">Umów wizytę</a></div></div></section>`;
};

/* ---- ZESPÓŁ — AUTORYTET: konkretne specjalizacje, certyfikaty,
   lata praktyki. Twarze budują relację jeszcze przed wizytą. ---- */
R.team = ()=>`<section class="section section--alt" data-block="zespol" id="zespol"><div class="container">
  <div class="sec-head center reveal"><span class="kicker">Zespół</span><h2>Eksperci, którym zaufasz</h2>
  <p class="sub">Każdy z nas ma swoją specjalizację — dzięki temu trafiasz zawsze do właściwych rąk.</p></div>
  <div class="grid-4">${TEAM.map(t=>`<div class="card team-card reveal">
    <img src="${t.img}" alt="${t.n} — ${t.r}"><h3>${t.n}</h3><div class="role">${t.r}</div>
    <p class="bio">${t.b}</p><span class="cert">✓ ${t.c}</span></div>`).join('')}</div></div></section>`;

/* ---- OPINIE — SOCIAL PROOF + STORYTELLING: historie klientek
   ("case studies"), w które łatwo się wczuć. 3 warianty layoutu. ---- */
R.reviews = (s,variant)=>{
  const head=`<div class="sec-head center reveal"><span class="kicker">Opinie</span><h2>Historie naszych klientek i klientów</h2>
    <p class="sub">Średnia ocena 4.9/5 z 640 opinii w Google i Booksy.</p></div>`;
  const one=r=>`<div class="card review"><span class="stars">${stars(r.s)}</span>
    <p class="txt">„${r.t}”</p><div class="who"><img src="${r.img}" alt="Zdjęcie: ${r.n}">
    <div><div class="nm">${r.n}</div><div class="meta">${r.m}</div></div></div></div>`;
  if(variant==='grid') return `<section class="section" data-block="opinie"><div class="container">${head}
    <div class="grid-2">${REVIEWS.map(r=>`<div class="reveal">${one(r)}</div>`).join('')}</div></div></section>`;
  if(variant==='big') return `<section class="section" data-block="opinie"><div class="container">${head}
    <div class="carousel reveal" data-carousel><div class="carousel__track">
    ${REVIEWS.map(r=>`<div class="carousel__slide"><div class="review review--big">
      <span class="stars">${stars(r.s)}</span><p class="txt">„${r.t}”</p>
      <div class="who"><img src="${r.img}" alt=""><div><div class="nm">${r.n}</div><div class="meta">${r.m}</div></div></div></div></div>`).join('')}
    </div><div class="carousel__nav"><button data-prev aria-label="Poprzednia opinia">←</button><button data-next aria-label="Następna opinia">→</button></div></div></div></section>`;
  return `<section class="section" data-block="opinie"><div class="container">${head}
    <div class="carousel reveal" data-carousel style="max-width:760px;margin-inline:auto"><div class="carousel__track">
    ${REVIEWS.map(r=>`<div class="carousel__slide">${one(r)}</div>`).join('')}
    </div><div class="carousel__nav"><button data-prev aria-label="Poprzednia opinia">←</button><button data-next aria-label="Następna opinia">→</button></div></div></div></section>`;
};

/* ---- LICZBY — SOCIAL PROOF w pigułce; animowane liczniki
   przyciągają wzrok i "udowadniają" skalę. ---- */
R.stats = ()=>`<section class="section stats" data-block="statystyki"><div class="container">
  <div class="grid-4">${STATS.map(x=>`<div class="stat reveal"><div class="num" data-count="${x.v}" data-dec="${x.dec||0}" data-suf="${x.suf}">0</div><div class="lbl">${x.l}</div></div>`).join('')}</div></div></section>`;

/* ---- PROMOCJA + ODLICZANIE — SCARCITY & URGENCY (limit czasu,
   limit miejsc) + WZAJEMNOŚĆ (prezent/zniżka na start w S2/S4). ---- */
R.promo = (s)=>{
  const c=s.copy;
  return `<section class="section promo" data-block="promocja"><div class="container">
    <div class="card reveal"><span class="kicker">Oferta limitowana</span><h2>${c.promoT}</h2>
    <p style="margin-inline:auto;color:var(--muted)">${c.promoX}</p>
    <div class="countdown" data-countdown>
      <div class="cd-box"><b data-d>00</b><span>dni</span></div>
      <div class="cd-box"><b data-h>00</b><span>godz</span></div>
      <div class="cd-box"><b data-m>00</b><span>min</span></div>
      <div class="cd-box"><b data-s>00</b><span>sek</span></div></div>
    <a class="btn btn--primary" href="#rezerwacja">Rezerwuję z rabatem</a>
    <p class="slots">Na ten tydzień zostały <b data-slots>4</b> wolne terminy</p></div></div></section>`;
};

/* ---- BLOG — świeże treści = wiarygodność i powód do powrotu ---- */
R.blog = ()=>`<section class="section section--alt" data-block="blog"><div class="container">
  <div class="sec-head center reveal"><span class="kicker">Blog</span><h2>Trendy i porady</h2></div>
  <div class="grid-3">${BLOG.map(b=>`<article class="card blog-card reveal"><img src="${b.img}" alt="">
    <div class="bd"><span class="date">${b.d}</span><h3>${b.t}</h3><p>${b.x}</p>
    <a href="#" onclick="return false">Czytaj dalej →</a></div></article>`).join('')}</div></div></section>`;

/* ---- INSTAGRAM — wizualny social proof, żywy salon "tu i teraz" ---- */
R.ig = ()=>`<section class="section" data-block="instagram"><div class="container">
  <div class="sec-head center reveal"><span class="kicker">Instagram</span><h2>@salon.na.instagramie</h2>
  <p class="sub">Codzienna dawka metamorfoz — dołącz do 18 tys. obserwujących.</p></div>
  <div class="ig-grid reveal">${[IMG.styling1,IMG.styling2,IMG.styling3,IMG.w6,IMG.w7,IMG.salon1].map(i=>`<a href="#" onclick="return false" aria-label="Post na Instagramie"><img src="${i}" alt="Fryzura z naszego Instagrama"></a>`).join('')}</div></div></section>`;

/* ---- FAQ — rozbraja obiekcje przed rezerwacją (mniej barier = 
   więcej konwersji); odpowiedź o darmowej konsultacji = WZAJEMNOŚĆ ---- */
R.faq = ()=>`<section class="section section--alt" data-block="faq"><div class="container">
  <div class="sec-head center reveal"><span class="kicker">FAQ</span><h2>Częste pytania</h2></div>
  <div class="faq reveal">${FAQ.map(f=>`<details><summary>${f.q}</summary><div class="a">${f.a}</div></details>`).join('')}</div></div></section>`;

/* ---- REZERWACJA — główny punkt konwersji. Obok formularza
   WZAJEMNOŚĆ: darmowa konsultacja / -10% na start. ---- */
R.booking = (s)=>{
  const c=s.copy;
  return `<section class="section booking" data-block="rezerwacja" id="rezerwacja"><div class="container">
    <div class="reveal"><span class="kicker">Rezerwacja</span><h2>Umów swoją wizytę</h2>
    <p style="color:var(--muted)">Wypełnij formularz — oddzwonimy w ciągu 2 godzin (w godzinach pracy), aby potwierdzić termin. Możesz też po prostu zadzwonić: <b style="color:var(--accent)">${CONTACT.tel}</b>.</p>
    <div class="gift"><span class="ico">🎁</span><span><b>Bonus na start:</b> pierwsza wizyta z bezpłatną konsultacją i <b>−10%</b> na dowolną usługę.</span></div></div>
    <form class="form reveal" data-booking novalidate>
      <div><label for="f-name">Imię i nazwisko</label><input id="f-name" required placeholder="Anna Kowalska"></div>
      <div><label for="f-tel">Telefon</label><input id="f-tel" type="tel" required placeholder="+48 ___ ___ ___"></div>
      <div><label for="f-srv">Usługa</label><select id="f-srv">${SERVICES.map(x=>`<option>${x.n}</option>`).join('')}</select></div>
      <div><label for="f-date">Preferowany termin</label><input id="f-date" type="date"></div>
      <div class="full"><label for="f-msg">Wiadomość (opcjonalnie)</label><textarea id="f-msg" rows="3" placeholder="np. mam włosy do pasa, zależy mi na sobocie rano"></textarea></div>
      <div class="full"><button class="btn btn--primary" type="submit" style="width:100%">${c.cta1} →</button></div>
      <p class="ok" data-ok>Dziękujemy! Twoja prośba o rezerwację została wysłana — odezwiemy się wkrótce. 💛</p>
    </form></div></section>`;
};

/* ---- MAPA + GODZINY — konkret lokalizacji obniża próg decyzji ---- */
R.map = ()=>`<section class="section section--alt map" data-block="mapa" id="kontakt"><div class="container">
  <div class="reveal"><iframe title="Mapa dojazdu" loading="lazy"
    src="https://www.openstreetmap.org/export/embed.html?bbox=20.995%2C52.222%2C21.030%2C52.238&amp;layer=mapnik&amp;marker=52.2299%2C21.0122"></iframe></div>
  <div class="hours reveal"><span class="kicker">Znajdź nas</span><h2>Lokalizacja i godziny</h2>
  <p style="color:var(--muted);margin-bottom:20px">${CONTACT.addr}<br>2 minuty od DINO</p>
  ${HOURS.map(h=>`<div class="row"><span>${h[0]}</span><b>${h[1]}</b></div>`).join('')}
  <div class="btn-row"><a class="btn btn--ghost" href="tel:${CONTACT.tel.replace(/ /g,'')}">Zadzwoń do nas</a></div></div></div></section>`;

/* ---- STOPKA — PEAK-END RULE: ostatnie wrażenie = wielkie CTA,
   dopiero potem dane, newsletter (WZAJEMNOŚĆ: rabat za zapis). ---- */
R.footer = (s)=>{
  const c=s.copy;
  return `<footer class="footer" data-block="stopka"><div class="container">
    <div class="footer__cta reveal"><span class="kicker">${c.brand}</span><h2>${c.footT}</h2><p>${c.footX}</p>
    <div class="btn-row" style="justify-content:center"><a class="btn btn--primary" href="#rezerwacja">${c.cta1}</a>
    <a class="btn btn--ghost" href="tel:${CONTACT.tel.replace(/ /g,'')}">Zadzwoń: ${CONTACT.tel}</a></div></div>
    <div class="footer__cols">
      <div><h4>${c.brand}</h4><p style="color:var(--muted);font-size:.94rem">${CONTACT.addr}<br>${CONTACT.tel}${CONTACT.mail ? '<br>' + CONTACT.mail : ''}</p></div>
      <div><h4>Menu</h4><ul><li><a href="#o-nas">O nas</a></li><li><a href="#cennik">Cennik</a></li><li><a href="#metamorfozy">Metamorfozy</a></li><li><a href="#rezerwacja">Rezerwacja</a></li></ul></div>
      <div><h4>Social media</h4><ul><li><a href="#" onclick="return false">Instagram</a></li><li><a href="#" onclick="return false">Facebook</a></li><li><a href="#" onclick="return false">TikTok</a></li><li><a href="#" onclick="return false">Booksy</a></li></ul></div>
      <div><h4>Newsletter</h4><p style="color:var(--muted);font-size:.9rem">Zapisz się i odbierz <b style="color:var(--accent)">−10%</b> na pierwszą wizytę.</p>
      <form class="newsletter" data-news><input type="email" placeholder="Twój e-mail" aria-label="Adres e-mail" required><button type="submit">Zapisz</button></form></div></div>
    <div class="footer__bar"><span>© 2026 ${c.brand}. Projekt demo agencji web design.</span><span>Polityka prywatności · Regulamin</span></div>
  </div></footer>`;
};

/* ---- MARQUEE (S3) — dynamiczny pasek haseł/nagród ---- */
R.marquee = ()=>{
  const items='<span><em>✦</em>Koloryzacje kreatywne</span><span><em>✦</em>4.9★ w Google</span><span><em>✦</em>Salon Roku 2025</span><span><em>✦</em>5000+ metamorfoz</span><span><em>✦</em>Olaplex Expert</span>';
  return `<div class="marquee" data-block="marquee"><div class="marquee__inner">${items}${items}</div></div>`;
};
</script>

<script>
/* ============================================================
   SILNIK DEMO: zakładki, loader, render stylu, interakcje
   ============================================================ */
const app = document.getElementById('app');
const loaderEl = document.getElementById('loader');
const loaderTxt = document.getElementById('loaderTxt');
const tabsEl = document.getElementById('tabs');

/* --- zakładki w sticky headerze --- */
Object.entries(STYLES).forEach(([id,s])=>{
  const b=document.createElement('button');
  b.className='tab'; b.textContent=s.name; b.dataset.id=id;
  b.addEventListener('click',()=>{ if(document.body.dataset.style!==id) setStyle(id); });
  tabsEl.appendChild(b);
});

/* --- budowa strony dla wybranego stylu --- */
function render(id){
  const s=STYLES[id];
  app.innerHTML = s.order.map(entry=>{
    const [name,variant]=entry.split(':');
    return R[name] ? R[name](s,variant) : '';
  }).join('');
  document.title = `${s.copy.brand} — ${s.name} | Demo salonu fryzjerskiego`;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));
}

/* --- płynna zmiana stylu: fade-out → loader → nowy render → fade-in --- */
function setStyle(id){
  loaderTxt.textContent='Ładowanie nowego stylu: '+STYLES[id].name.split('·')[1].trim()+'…';
  loaderEl.classList.add('on');
  app.classList.add('hide');
  setTimeout(()=>{
    document.body.dataset.style=id;
    render(id);
    window.scrollTo({top:0,behavior:'instant'});
    initInteractions();
    setTimeout(()=>{ loaderEl.classList.remove('on'); app.classList.remove('hide'); },420);
  },520);
}

/* ============================================================
   INTERAKCJE (wywoływane po każdym renderze)
   ============================================================ */
let revealObs=null, carouselTimers=[], countdownTimer=null;

function initInteractions(){
  /* --- 1. Fade-in przy scrollu (subtelny efekt "zachwytu") --- */
  if(revealObs) revealObs.disconnect();
  revealObs=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); revealObs.unobserve(e.target); }
  }),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>revealObs.observe(el));

  /* --- 2. Animowane liczniki statystyk (social proof w ruchu) --- */
  const cntObs=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    const el=e.target, target=parseFloat(el.dataset.count), dec=+el.dataset.dec, suf=el.dataset.suf||'';
    const t0=performance.now(), dur=1600;
    (function tick(t){
      const p=Math.min((t-t0)/dur,1), eased=1-Math.pow(1-p,3);
      el.textContent=(target*eased).toFixed(dec).replace('.',',')+suf;
      if(p<1) requestAnimationFrame(tick);
    })(t0);
    cntObs.unobserve(el);
  }),{threshold:.6});
  document.querySelectorAll('[data-count]').forEach(el=>cntObs.observe(el));

  /* --- 3. Suwak Przed/Po (efekt kontrastu — angażująca interakcja) --- */
  document.querySelectorAll('.ba').forEach(ba=>{
    ba.querySelector('.ba__range').addEventListener('input',e=>{
      ba.style.setProperty('--pos',e.target.value+'%');
    });
  });

  /* --- 3b. Panele usług: hover desktop, tap mobile --- */
  const touchLayout=window.matchMedia('(hover: none), (max-width: 860px)').matches;
  document.querySelectorAll('.service-panel-host').forEach(host=>{
    if(!touchLayout) return;
    host.addEventListener('click',e=>{
      if(e.target.closest('.service-panel__cta')) return;
      const open=host.classList.contains('is-open');
      document.querySelectorAll('.service-panel-host.is-open').forEach(item=>item.classList.remove('is-open'));
      if(!open) host.classList.add('is-open');
    });
    host.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        const open=host.classList.contains('is-open');
        document.querySelectorAll('.service-panel-host.is-open').forEach(item=>item.classList.remove('is-open'));
        if(!open) host.classList.add('is-open');
      }
      if(e.key==='Escape') host.classList.remove('is-open');
    });
  });

  /* --- 4. Karuzela opinii (auto-przewijanie + strzałki) --- */
  carouselTimers.forEach(clearInterval); carouselTimers=[];
  document.querySelectorAll('[data-carousel]').forEach(c=>{
    const track=c.querySelector('.carousel__track'), n=track.children.length;
    let i=0;
    const go=d=>{ i=(i+d+n)%n; track.style.transform=`translateX(-${i*100}%)`; };
    c.querySelector('[data-prev]').addEventListener('click',()=>go(-1));
    c.querySelector('[data-next]').addEventListener('click',()=>go(1));
    carouselTimers.push(setInterval(()=>go(1),6500));
  });

  /* --- 5. Licznik promocji (URGENCY: realne odliczanie do końca oferty)
         + malejąca liczba wolnych terminów (SCARCITY) --- */
  if(countdownTimer) clearInterval(countdownTimer);
  const cd=document.querySelector('[data-countdown]');
  if(cd){
    const end=Date.now()+1000*60*60*38+1000*60*24; // demo: ~1,5 doby
    const pad=x=>String(x).padStart(2,'0');
    const paint=()=>{
      let ms=Math.max(end-Date.now(),0), s=Math.floor(ms/1000);
      cd.querySelector('[data-d]').textContent=pad(Math.floor(s/86400));
      cd.querySelector('[data-h]').textContent=pad(Math.floor(s%86400/3600));
      cd.querySelector('[data-m]').textContent=pad(Math.floor(s%3600/60));
      cd.querySelector('[data-s]').textContent=pad(s%60);
    };
    paint(); countdownTimer=setInterval(paint,1000);
  }

  /* --- 6. Delikatny parallax zdjęcia hero --- */
  const pImg=document.querySelector('[data-parallax]');
  if(pImg){
    window.onscroll=()=>{ const y=window.scrollY; if(y<window.innerHeight) pImg.style.transform=`translateY(${y*.18}px) scale(1.06)`; };
  } else window.onscroll=null;

  /* --- 7. Formularze (demo: potwierdzenie bez backendu) --- */
  const bk=document.querySelector('[data-booking]');
  if(bk) bk.addEventListener('submit',e=>{
    e.preventDefault();
    if(!bk.querySelector('#f-name').value.trim()||!bk.querySelector('#f-tel').value.trim()){
      bk.querySelector('#f-name').reportValidity(); return;
    }
    bk.querySelector('[data-ok]').style.display='block';
    bk.querySelector('button[type=submit]').textContent='Wysłano ✓';
  });
  const nw=document.querySelector('[data-news]');
  if(nw) nw.addEventListener('submit',e=>{
    e.preventDefault();
    nw.innerHTML='<p style="color:var(--accent);font-weight:600">Dziękujemy! Kod rabatowy −10% wysłaliśmy na Twój e-mail. ✓</p>';
  });
}

/* --- start: Styl 1 --- */
render('s1');
initInteractions();
</script>
</body>
</html>
